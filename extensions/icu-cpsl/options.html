<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>CPSL · Opzioni Intervals.icu</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; color: #222; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    .hint { font-size: 12px; color: #666; margin-top: 6px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>
  <h2>🔧 CPSL per Intervals.icu</h2>

  <label for="mode">Metodo di autenticazione</label>
  <select id="mode">
    <option value="apikey">API Key (consigliato)</option>
    <option value="oauth">OAuth Bearer Token</option>
  </select>

  <div id="keywrap">
    <label for="key">Intervals.icu API Key</label>
    <input type="password" id="key" placeholder="incolla qui la tua API key" autocomplete="off">
    <p class="hint">La stessa usata in CPSL → Settings → Connections. Creala su intervals.icu → Settings → API Keys.</p>
  </div>

  <div id="tokenwrap" style="display:none">
    <label for="token">OAuth Access Token</label>
    <input type="password" id="token" placeholder="Bearer token da un'app OAuth ICU" autocomplete="off">
    <p class="hint">Per sviluppatori: token ottenuto via OAuth2 di intervals.icu.</p>
  </div>

  <label for="cpslUrl">URL CPSL locale (bridge)</label>
  <input type="text" id="cpslUrl" placeholder="http://127.0.0.1:22400">

  <button id="save">Salva</button>
  <p id="status" class="hint"></p>

  <script src="options.js"></script>
</body>
</html>
