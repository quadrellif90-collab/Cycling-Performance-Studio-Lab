name: CPSL CI/CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-${{ matrix.os }}.txt
          pip install pytest pytest-asyncio pytest-cov ruff black

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'

  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements-${{ matrix.os }}.txt

      - name: Build executable
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build_win.bat
          elif [ "$RUNNER_OS" == "macOS" ]; then
            ./build_mac.sh
          else
            ./build_linux.sh
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpsl-${{ matrix.os }}-build
          path: dist/
          retention-days: 10

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "CPSL ${{ github.ref_name }}"
          body: |
            ## CPSL v${{ github.ref_name }}

            ### What's New
            - BIA Vision Analysis integration
            - Self-update cross-platform support
            - 8 proprietary analytical modules
            - 145+ API routes from Domestique

            ### Assets
            - Windows: `CyclingPerformanceStudioLab.exe`
            - macOS: `Cycling-Performance-Studio-Lab.dmg` (quando buildato)
            - Linux: `CyclingPerformanceStudioLab` (quando buildato)

            ### Test Results
            - 201/201 core tests passing
            - 24/25 workout player tests passing

          draft: false
          prerelease: false

          # Generate changelog from git tags
          # Changelog will be auto-generated from previous tag

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cpsl-windows-exe
          path: dist/CyclingPerformanceStudioLab.exe

      - name: Upload release assets (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: cpsl-mac-dmg
          path: dist/

      - name: Upload release assets (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cpsl-linux-build
          path: dist/

      - name: Publish to GitHub Packages
        if: false  # Disabled for now
        # puoi abilitare questo step se vuoi pubblicare su GitHub Packages